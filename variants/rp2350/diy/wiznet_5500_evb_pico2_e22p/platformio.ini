[env:wiznet_5500_evb_pico2_e22p]
extends = rp2350_base
board = wiznet_5500_evb_pico2
board_level = community
upload_protocol = picotool

# Pull mbedTLS sources from pico-sdk into the build so HAS_ETHERNET_TLS_API can
# call mbedtls_* (only BearSSL is precompiled in arduino-pico framework libs).
# Must inherit ${env.extra_scripts} or the root chain (pre:platformio-pre,
# platformio-custom which injects APP_VERSION, post:nrf54l15_linker) is lost.
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/add_mbedtls_sources.py

# Increase LittleFS from 0.5m to 0.75m so GZIP firmware (~614KB) fits for OTA staging
board_build.filesystem_size = 0.75m

# Reuses the variant.h from variants/rp2350/diy/pico2_w5500_e22 - same LoRa
# pinout, same W5500 pin mapping. The only differences vs pico2_w5500_e22 are
# the board target (this PCB has 2 MB flash instead of 4 MB) and the W5500
# being soldered on-board instead of an external module.
build_flags =
  ${rp2350_base.build_flags}
  -ULED_BUILTIN                   # avoid "LED_BUILTIN redefined" warnings from framework common.h
  -I variants/rp2350/diy/pico2_w5500_e22
  -D HW_SPI1_DEVICE
  -D EBYTE_E22_900M30S            # selects the EBYTE E22(P)-900M30S(S) module config, including TCXO voltage support and TX gain / max power settings
  -D TRACEROUTE_DUMP              # TEMPORARY: hex-dump every incoming traceroute payload to syslog, hunting the crash
  -D FAULT_CAPTURE                # TEMPORARY: stash the faulting PC/LR/CFSR across the reset to pin the crash; now also catches CORE0 stack overflow
  -D HEAP_WATCH                   # TEMPORARY: periodic free-heap/packetPool telemetry + snapshot into FAULT_CAPTURE
  -D STACK_WATCH                  # TEMPORARY: periodic CORE0 FreeRTOS task stack low-water mark telemetry
  -D MESHTASTIC_ENABLE_FRAME_INJECTION=1  # TEMPORARY: let inject_frame feed forged traceroutes into the RX path for repro
  -fstack-usage                   # TEMPORARY: emit .su per-function stack-frame sizes, hunting the wantConfig CORE0 stack dip to 584B free
  -D HAS_ETHERNET_OTA
  -D HAS_ETHERNET_API             # HTTP API server on TCP/80 (mesh/http port to RP2350)
  -D HAS_ETHERNET_TLS_API         # HTTPS API server on TCP/443 + on-device self-signed cert (mbedTLS)
  -D MQTT_SOCKET_TIMEOUT=3         # cap PubSubClient blocking connect/read (default 15s); a wedged/unreachable broker can't freeze the cooperative loop on W5500
  # MBEDTLS_USER_CONFIG_FILE is injected via scripts/add_mbedtls_sources.py
  # (the quoted-string CPPDEFINE doesn't survive build_flags shell parsing on Windows)
  -D MESHTASTIC_EXCLUDE_WIFI      # board has Ethernet only — no WiFi hardware
  -D MESHTASTIC_EXCLUDE_BLUETOOTH # board has no BT hardware
  -D MESHTASTIC_EXCLUDE_SCREEN
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER
  -D MESHTASTIC_EXCLUDE_AUDIO
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION
  -D MESHTASTIC_EXCLUDE_INPUTBROKER
  # Stack-margin hardening (2026-07-27): the recursive LittleFS file-manifest walk
  # (PhoneAPI::handleStartConfig -> getFiles -> collectFiles, 3 levels) plus the
  # framework's LittleFSImpl::openDir()/isDirectory() was measured eating ~3.2 KB
  # of the 4 KB CORE0 task stack during a plain wantConfig - the single deepest
  # point seen across days of exposure. This board's /prefs/ only ever holds
  # internal firmware protos, nothing a companion app's file browser would show
  # a user anyway; the official Web client doesn't even read FileInfo, and
  # Android just shows an empty list (same trade-off nRF54L15 already ships).
  -D MESHTASTIC_EXCLUDE_FILES_MANIFEST
  # Auto-config: serial/BLE config paths are excluded; bake region + ethernet defaults
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
  -D USERPREFS_NETWORK_ETH_ENABLED=true

# Re-enable Ethernet and API source paths excluded in rp2350_base
build_src_filter = ${rp2350_base.build_src_filter} +<mesh/eth/> +<mesh/api/> +<mqtt/>

lib_deps =
  ${rp2350_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  # Standard WIZnet Ethernet library - supports W5100/W5200/W5500 auto-detect
  arduino-libraries/Ethernet@^2.0.2

debug_build_flags = ${rp2350_base.build_flags}, -g
debug_tool = cmsis-dap
