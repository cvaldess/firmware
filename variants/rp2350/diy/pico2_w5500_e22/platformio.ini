[env:pico2_w5500_e22]
extends = rp2350_base
board = rpipico2
board_level = community
upload_protocol = picotool

# Increase LittleFS from 0.5m to 0.75m so GZIP firmware (~614KB) fits for OTA staging
board_build.filesystem_size = 0.75m

build_flags =
  ${rp2350_base.build_flags}
  -ULED_BUILTIN                   # avoid "LED_BUILTIN redefined" warnings from framework common.h
  -I variants/rp2350/diy/pico2_w5500_e22
  -D HW_SPI1_DEVICE
  -D EBYTE_E22_900M30S            # selects the EBYTE E22-900M30S module config, including TCXO voltage support and TX gain / max power settings
  -D HAS_SE050                    # NXP SE050 secure element on I2C 0x48 (only on carriers that populate one)
  # SE050 ENA on GP7: hardware modification, NOT the carrier as fabricated. The board ties ENA to
  # VIN, which leaves the secure element wedged after every MCU reset until it is power cycled by
  # hand. The mod cuts the pin 11 / pin 12 bridge and adds 6.8k to 3V3 + 47nF to GND on ENA, wired
  # to GP7. Only define this on a board that actually carries the mod: without the cut, driving GP7
  # low fights the 3V3 rail through the ferrite.
  -D SE050_ENA_PIN=7
  # HAS_CUSTOM_CRYPTO_ENGINE (swap the software Curve25519 for the SE050 on the PKI path) stays
  # OFF: the boot self-test passes, but a real PKI DM reboots the board. xfer() calls delay()
  # inside its poll loop and yields to the cooperative scheduler, so a second agreement can
  # re-enter the driver mid-transaction. Needs a re-entrancy guard first.
  # -D HAS_CUSTOM_CRYPTO_ENGINE
  -D HAS_ETHERNET_OTA
  -D HAS_ETHERNET_API             # HTTP API server on TCP/80 (mesh/http port to RP2350)
  -D HAS_ETHERNET_TLS_API         # HTTPS API server on TCP/443 + on-device self-signed cert (mbedTLS)
  -D MQTT_SOCKET_TIMEOUT=3         # cap PubSubClient blocking connect/read (default 15s); a wedged/unreachable broker can't freeze the cooperative loop on W5500
  # Exclude features the pico2_w5500_e22 hardware doesn't have. Without these,
  # the binary grows ~210 KB which gzips past the 768 KB LittleFS slot used
  # for OTA staging — Update.begin() fails before the upload even starts.
  -D MESHTASTIC_EXCLUDE_WIFI      # no WiFi hardware on this DIY board
  -D MESHTASTIC_EXCLUDE_BLUETOOTH # no BT hardware on this DIY board
  -D MESHTASTIC_EXCLUDE_SCREEN
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER
  -D MESHTASTIC_EXCLUDE_AUDIO
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION
  -D MESHTASTIC_EXCLUDE_INPUTBROKER
  # Fork-only defaults — do not push upstream (region-neutral for PR)
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
  -D USERPREFS_NETWORK_ETH_ENABLED=true

# Pull mbedTLS sources from pico-sdk into the build so HAS_ETHERNET_TLS_API can
# call mbedtls_* (only BearSSL is precompiled in arduino-pico framework libs).
# Must inherit ${env.extra_scripts} or the root chain (pre:platformio-pre,
# pre:platformio-custom — which injects APP_VERSION etc.) is dropped.
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/add_mbedtls_sources.py

# Re-enable Ethernet and API source paths excluded in rp2350_base
build_src_filter = ${rp2350_base.build_src_filter} +<mesh/eth/> +<mesh/api/> +<mqtt/>

lib_deps =
  ${rp2350_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  # Standard WIZnet Ethernet library - supports W5100/W5200/W5500 auto-detect
  arduino-libraries/Ethernet@^2.0.2

debug_build_flags = ${rp2350_base.build_flags}, -g
debug_tool = cmsis-dap
