# WIZnet W5100S-EVB-Pico2 on the e22p carrier — the W5100S sibling of
# wiznet_5500_evb_pico2_e22p. Same RP2350 (2 MB flash), same carrier, same LoRa
# module and pinout; the only hardware difference is the on-board Ethernet chip.
#
# The W5100S is register-incompatible with the arduino-libraries/Ethernet W5500
# driver, so this env swaps in RAKWireless' RAK13800_W5100S (same Ethernet /
# EthernetClient API) and selects it via -D USE_W5100S, which suppresses
# USE_ARDUINO_ETHERNET in the shared variant.h.
#
# The W5100S-EVB-Pico2 Ethernet pinout (per docs.wiznet.io) is identical to the
# W5500-EVB-Pico2 and already matches the shared variant.h:
#   MISO=GP16  CS=GP17  SCK=GP18  MOSI=GP19  RST=GP20  (INT=GP21, unused)
[env:wiznet_5100s_evb_pico2_e22p]
extends = rp2350_base
board = wiznet_5100s_evb_pico2
board_level = community
upload_protocol = picotool

# No add_mbedtls_sources.py here: that script exists to satisfy
# HAS_ETHERNET_TLS_API, which this variant drops for socket budget reasons (see
# build_flags). Keep ${env.extra_scripts} or the root chain is lost
# (platformio-custom injects APP_VERSION).
extra_scripts = ${env.extra_scripts}

# Increase LittleFS from 0.5m to 0.75m so GZIP firmware (~614KB) fits for OTA staging
board_build.filesystem_size = 0.75m

# Reuses the variant.h from variants/rp2350/diy/pico2_w5500_e22 — same LoRa
# pinout and same W5500/W5100S pin mapping. -D USE_W5100S flips the Ethernet
# driver (see the lib_deps swap below).
build_flags =
  ${rp2350_base.build_flags}
  -ULED_BUILTIN                   # avoid "LED_BUILTIN redefined" warnings from framework common.h
  -I variants/rp2350/diy/pico2_w5500_e22
  -D USE_W5100S                   # WIZnet W5100S instead of W5500 (RAK13800_W5100S driver)
  -D HW_SPI1_DEVICE
  -D EBYTE_E22_900M30S            # selects the EBYTE E22(P)-M30S module config (TCXO + TX gain / max power); same PA family for 433/900
  # ---- SOCKET BUDGET (why this variant carries fewer services than the W5500 one)
  # The W5100S has only 4 hardware sockets; the W5500 has 8. Both drivers pick
  # MAX_SOCK_NUM from the HOST's RAM size, not from the Ethernet chip, so this
  # build still compiles with MAX_SOCK_NUM = 8 and will hand out socket indices
  # 4-7 that do not physically exist. Verified on hardware with -D ETH_SOCKET_DIAG:
  # sockets 0-3 read valid state, 4-7 read an identical invalid 0x03/0x01.
  #
  # Outbound work (DNS, NTP, MQTT) also needs a free socket, so listeners have to
  # stay well under 4. With all 4 taken by listeners the NTP client was handed
  # sockindex 8 and hung looping on a phantom socket until the watchdog fired.
  #
  # So, unlike wiznet_5500_evb_pico2_e22p: no HAS_ETHERNET_OTA (frees TCP/4243 and
  # TCP/4244) and no HAS_ETHERNET_TLS_API (frees TCP/443). Remaining listeners are
  # the API on 4403 and HTTP on 80 = 2, leaving 2 sockets spare.
  # Consequence: this board has NO Ethernet OTA and no HTTPS - flash it over USB.
  -D HAS_SE050                    # NXP SE050 secure element on I2C 0x48 (this carrier populates one)
  # SE050 ENA on GP7: hardware modification, NOT the fabricated carrier as shipped. The board ties
  # ENA to VIN, which leaves the secure element wedged after every MCU reset until it is power
  # cycled by hand. The mod cuts the pin 11 / pin 12 bridge and adds 6.8k to 3V3 + 47nF to GND on
  # ENA, wired to GP7. Only define this on a board that actually carries the mod: without the cut,
  # driving GP7 low fights the 3V3 rail through the ferrite.
  -D SE050_ENA_PIN=7
  # Swap the software Curve25519 for the SE050 on the PKI path (src/security/SE050CryptoEngine.cpp
  # supplies `crypto` instead of the default in CryptoEngine.cpp). Mirrored stage: the private key
  # still lives in config, the chip just holds a copy and does the agreement, so nothing else in
  # the firmware changes behaviour. Falls back to software if the chip is missing or the import
  # fails, so a node is never left unable to decrypt.
  -D HAS_CUSTOM_CRYPTO_ENGINE
  -D HAS_ETHERNET_API             # HTTP API server on TCP/80 (mesh/http port to RP2350)
  -D MQTT_SOCKET_TIMEOUT=3         # cap PubSubClient blocking connect/read (default 15s); a wedged/unreachable broker can't freeze the cooperative loop
  -D MESHTASTIC_EXCLUDE_WIFI      # board has Ethernet only — no WiFi hardware
  -D MESHTASTIC_EXCLUDE_BLUETOOTH # board has no BT hardware
  -D MESHTASTIC_EXCLUDE_SCREEN
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR
  -D MESHTASTIC_EXCLUDE_HEALTH_TELEMETRY
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER
  -D MESHTASTIC_EXCLUDE_AUDIO
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION
  -D MESHTASTIC_EXCLUDE_INPUTBROKER
  # Auto-config: serial/BLE config paths are excluded; bake region + ethernet defaults
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_EU_868
  -D USERPREFS_NETWORK_ETH_ENABLED=true

# Re-enable Ethernet and API source paths excluded in rp2350_base
build_src_filter = ${rp2350_base.build_src_filter} +<mesh/eth/> +<mesh/api/> +<mqtt/>

lib_deps =
  ${rp2350_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  # WIZnet W5100S driver (RAKWireless fork) — same Ethernet/EthernetClient API
  # as arduino-libraries/Ethernet, but supports the W5100S chip on this board.
  # renovate: datasource=github-tags depName=RAK13800-W5100S packageName=RAKWireless/RAK13800-W5100S
  https://github.com/RAKWireless/RAK13800-W5100S/archive/1.0.2.zip

debug_build_flags = ${rp2350_base.build_flags}, -g
debug_tool = cmsis-dap
