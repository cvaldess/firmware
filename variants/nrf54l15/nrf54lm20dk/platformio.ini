[env:nrf54lm20dk]
# PRIVATE_HW (255) - the protobuf HardwareModel enum reserves DK / DIY boards
# without an SKU under PRIVATE_HW; no dedicated enum value will be assigned.
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = NRF54LM20_DK
custom_meshtastic_architecture = nrf54l15
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Nordic nRF54LM20-DK

extends = nrf54_base
# nRF54LM20A support (s145 10.0.1, SoftDevice files split by SoC family) only exists on this
# platform branch so far.
platform = https://github.com/andyshinn/platform-nordicnrf54.git#648a966ee20fb15b4b7b9cd8afdcf2a7a9415def
# LOCAL BRING-UP ONLY: meshtastic/nRF54_Arduino master + ashinn/nrf54lm20a + the nrf54lm20dk variant.
platform_packages =
  framework-arduinoadafruitnrf54@symlink://C:/Users/cvald/Documents/VSC/nRF54LM20_DK/nRF54_Arduino
board = nrf54lm20dk
board_level = extra
# The core's main.cpp starts USB through TinyUSB_Device_Init(), declared weak: from a library archive the
# linker never pulls the object that defines it. Link library objects directly instead.
lib_archive = no
upload_protocol = jlink
debug_tool = jlink

build_flags = ${nrf54_base.build_flags}
  -Ivariants/nrf54l15/nrf54lm20dk
  -DNRF54LM20_DK
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DHAS_GPS=0
  -DHAS_SCREEN=0
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  # The E22-900M30S PA adds ~10 dB after the SX1262: sets TX_GAIN_LORA 10 and SX126X_MAX_POWER 22.
  -D EBYTE_E22_900M30S
  # USB (USBHS) through the core's TinyUSB library; nRF52's builder adds this include path itself
  -IC:/Users/cvald/Documents/VSC/nRF54LM20_DK/nRF54_Arduino/libraries/Adafruit_TinyUSB_Arduino/src/arduino
  # INA228 breakout with a 15 mOhm (R015) shunt. Nothing on this bench comes near 2.5 A, and that
  # ceiling keeps the full-scale shunt voltage (37.5 mV) inside the finer +-40.96 mV range.
  -DINA228_SHUNT_R=0.015f
  -DINA228_MAX_CURRENT=2.5f

build_src_filter = ${nrf54_base.build_src_filter}
  +<../variants/nrf54l15/nrf54lm20dk>

# Bench sensors: INA228 (must strap to 0x40, 0x41 or 0x43 - the INA probe skips 0x45), and the
# nRF54L15-DK set, INA3221 (0x42) and SHT40 (0x44), should they move over.
lib_deps = ${nrf54_base.lib_deps}
  # The core's TinyUSB library (USB CDC as Serial): the dependency finder does not pick it up from Arduino.h
  Adafruit TinyUSB Library
  # renovate: datasource=github-tags depName=INA228 packageName=robtillaart/INA228
  https://github.com/RobTillaart/INA228/archive/refs/tags/0.4.1.zip
  # renovate: datasource=github-tags depName=INA3221_RT packageName=RobTillaart/INA3221_RT
  https://github.com/RobTillaart/INA3221_RT/archive/refs/tags/0.4.2.zip
  # renovate: datasource=github-tags depName=arduino-sht packageName=sensirion/arduino-sht
  https://github.com/Sensirion/arduino-sht/archive/refs/tags/v1.2.6.zip
  # BME680 on the bench bus (0x77). Same versions as environmental_base / environmental_extra, which
  # nrf54_base leaves out; the driver needs BusIO and Unified Sensor.
  # renovate: datasource=github-tags depName=Adafruit BusIO packageName=adafruit/Adafruit_BusIO
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  # renovate: datasource=github-tags depName=Adafruit Unified Sensor packageName=adafruit/Adafruit_Sensor
  https://github.com/adafruit/Adafruit_Sensor/archive/refs/tags/1.1.15.zip
  # renovate: datasource=github-tags depName=Adafruit_BME680 packageName=adafruit/Adafruit_BME680
  https://github.com/adafruit/Adafruit_BME680/archive/refs/tags/2.0.6.zip
