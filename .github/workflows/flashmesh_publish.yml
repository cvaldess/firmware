name: FlashMesh — Publish W5500 Variants

# Manual trigger only. ALWAYS run with --ref generate-catalog, NEVER from develop:
#   gh workflow run flashmesh_publish.yml -R cvaldess/firmware --ref generate-catalog \
#     -f version_prefix=2.8.1 -f force_rebuild=false
# develop is only the upstream sync point; generate-catalog carries the fork-only eth/OTA
# commits, so publishing from develop ships public images that are missing them.
# Order of operations: sync upstream -> develop, merge develop -> generate-catalog, then run this.
# Builds the two W5500 variants and POSTs each to /api/admin/upload on flasher.cvaldess.com.
# Skips per-variant if the current SHA7 is already in the catalog (override with force_rebuild).

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: 'Upstream version prefix (final version = <prefix>.<sha7>)'
        required: true
        default: '2.8.2'
        type: string
      force_rebuild:
        description: 'Rebuild + re-upload even if SHA already in catalog'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pio_env:
          - wiznet_5500_evb_pico2_e22p
          - pico2_w5500_e22
    env:
      FLASHMESH_ENDPOINT: https://flasher.cvaldess.com
    steps:
      - name: Mask secrets in logs
        run: |
          echo "::add-mask::${{ secrets.FLASHMESH_ADMIN_TOKEN }}"
          if [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ]; then
            echo "::add-mask::${{ secrets.R2_SECRET_ACCESS_KEY }}"
          fi
          if [ -n "${{ secrets.OTA_PSK_HEX }}" ]; then
            echo "::add-mask::${{ secrets.OTA_PSK_HEX }}"
          fi
          if [ -n "${{ secrets.CLOUDFLARE_PURGE_TOKEN }}" ]; then
            echo "::add-mask::${{ secrets.CLOUDFLARE_PURGE_TOKEN }}"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Compute SHA7 + version
        id: meta
        run: |
          SHA7=$(git rev-parse --short=7 HEAD)
          VERSION="${{ inputs.version_prefix }}.$SHA7"
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::pio_env=${{ matrix.pio_env }}  sha7=$SHA7  version=$VERSION"

      - name: Dedup check (skip if SHA already in catalog)
        id: dedup
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          PIO_ENV: ${{ matrix.pio_env }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
        run: |
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::force_rebuild=true — bypassing dedup"
            exit 0
          fi
          EXISTS=$(curl -fsS "$FLASHMESH_ENDPOINT/api/firmwares?env=$PIO_ENV" \
            | jq --arg sha "$SHA7" '[.[] | select(.sha==$sha)] | length')
          if [ "$EXISTS" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SHA $SHA7 already in catalog for $PIO_ENV — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache PlatformIO packages
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/cache
          key: pio-${{ runner.os }}-${{ matrix.pio_env }}-${{ hashFiles('platformio.ini', format('variants/**/{0}/platformio.ini', matrix.pio_env)) }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.pio_env }}-
            pio-${{ runner.os }}-

      - name: Set up Python
        if: steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        if: steps.dedup.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Inject OTA PSK (optional secret)
        if: steps.dedup.outputs.skip != 'true'
        env:
          OTA_PSK_HEX: ${{ secrets.OTA_PSK_HEX }}
        run: |
          if [ -z "${OTA_PSK_HEX:-}" ]; then
            echo "::notice::OTA_PSK_HEX not set — using compiled fallback in otaShared.cpp"
            exit 0
          fi
          if [ ${#OTA_PSK_HEX} -ne 64 ]; then
            echo "::error::OTA_PSK_HEX must be 64 hex chars (32 bytes); got ${#OTA_PSK_HEX}"
            exit 1
          fi
          if ! [[ "$OTA_PSK_HEX" =~ ^[0-9a-fA-F]+$ ]]; then
            echo "::error::OTA_PSK_HEX must be hex only"
            exit 1
          fi
          PSK_C=$(python3 -c "import sys;h=sys.argv[1];print('{'+','.join(f'0x{h[i:i+2]}' for i in range(0,len(h),2))+'}')" "$OTA_PSK_HEX")
          # PSK_C is masked transitively (OTA_PSK_HEX is masked, derived value follows)
          echo "::add-mask::$PSK_C"
          echo "PLATFORMIO_BUILD_FLAGS=-D USERPREFS_OTA_PSK=$PSK_C" >> "$GITHUB_ENV"
          echo "::notice::OTA PSK injected (32 bytes)"

      - name: Build firmware
        if: steps.dedup.outputs.skip != 'true'
        run: pio run -e ${{ matrix.pio_env }}

      - name: Locate build artifacts
        if: steps.dedup.outputs.skip != 'true'
        id: artifacts
        run: |
          BUILD_DIR=.pio/build/${{ matrix.pio_env }}
          ELF=$(ls "$BUILD_DIR"/firmware-*.elf 2>/dev/null | head -1)
          BIN=$(ls "$BUILD_DIR"/firmware-*.bin 2>/dev/null | head -1)
          # The .uf2 is the drag-and-drop download most people flash with, so it
          # is required — but only by the meshfiles step at the end, never here.
          # Failing at this point would abort before the catalog is uploaded and
          # cost the release; failing at the end costs nothing but the download.
          UF2=$(ls "$BUILD_DIR"/firmware-*.uf2 2>/dev/null | head -1)
          if [ -z "$ELF" ] || [ -z "$BIN" ]; then
            echo "::error::artifacts missing in $BUILD_DIR (elf=$ELF bin=$BIN)"
            ls -la "$BUILD_DIR" || true
            exit 1
          fi
          echo "elf=$ELF" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "uf2=$UF2" >> "$GITHUB_OUTPUT"
          echo "::notice::elf=$(basename "$ELF") bin=$(basename "$BIN") uf2=${UF2:+$(basename "$UF2")}"

      - name: Sanity check — OTA flag survived sync
        if: steps.dedup.outputs.skip != 'true'
        env:
          ELF: ${{ steps.artifacts.outputs.elf }}
        run: |
          NM_BIN=$(find ~/.platformio/packages -name 'arm-none-eabi-nm' 2>/dev/null | head -1)
          if [ -z "$NM_BIN" ]; then
            echo "::warning::arm-none-eabi-nm not found — skipping symbol sanity check"
            exit 0
          fi
          if ! "$NM_BIN" -C "$ELF" | grep -qE 'initEthOTA|initEthHttpOTA|OTAShared::'; then
            echo "::error::HAS_ETHERNET_OTA symbols missing — flag lost in platformio.ini?"
            exit 1
          fi
          echo "::notice::OTA symbols present in build"

      - name: Gzip firmware
        if: steps.dedup.outputs.skip != 'true'
        env:
          BIN: ${{ steps.artifacts.outputs.bin }}
        run: |
          gzip -9 -k -f "$BIN"
          ls -la "$BIN" "$BIN.gz"

      - name: Compute local CRC32
        if: steps.dedup.outputs.skip != 'true'
        id: crc
        env:
          BIN: ${{ steps.artifacts.outputs.bin }}
        run: |
          LOCAL_CRC=$(python3 -c "import sys,zlib;print(format(zlib.crc32(open(sys.argv[1],'rb').read()) & 0xffffffff, '08x'))" "$BIN.gz")
          echo "local_crc=$LOCAL_CRC" >> "$GITHUB_OUTPUT"
          echo "::notice::local crc32(.bin.gz) = $LOCAL_CRC"

      - name: Upload to FlashMesh admin endpoint
        if: steps.dedup.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.FLASHMESH_ADMIN_TOKEN }}
          BIN: ${{ steps.artifacts.outputs.bin }}
          PIO_ENV: ${{ matrix.pio_env }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
          LOCAL_CRC: ${{ steps.crc.outputs.local_crc }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::FLASHMESH_ADMIN_TOKEN secret not set"
            exit 1
          fi
          RESP=$(mktemp)
          HTTP=$(curl -sS -o "$RESP" -w '%{http_code}' \
            -X POST "$FLASHMESH_ENDPOINT/api/admin/upload" \
            -H "Authorization: Bearer $TOKEN" \
            -F "pio_env=$PIO_ENV" \
            -F "version=$VERSION" \
            -F "sha=$SHA7" \
            -F "firmware=@$BIN.gz;type=application/gzip")
          echo "--- server response ---"
          cat "$RESP"; echo
          echo "--- end ---"
          if [ "$HTTP" -ne 200 ]; then
            echo "::error::upload failed HTTP $HTTP"
            exit 1
          fi
          SERVER_CRC=$(jq -r '.entry.crc32_hex' < "$RESP")
          if [ "$SERVER_CRC" != "$LOCAL_CRC" ]; then
            echo "::error::server CRC $SERVER_CRC != local $LOCAL_CRC"
            exit 1
          fi
          echo "::notice::server CRC matches local: $SERVER_CRC"

      - name: Verify round-trip download
        if: steps.dedup.outputs.skip != 'true'
        env:
          PIO_ENV: ${{ matrix.pio_env }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA7: ${{ steps.meta.outputs.sha7 }}
          LOCAL_CRC: ${{ steps.crc.outputs.local_crc }}
        run: |
          KEY="firmware/$PIO_ENV/$VERSION/$SHA7/firmware.bin.gz"
          DL=$(mktemp)
          curl -fsS "$FLASHMESH_ENDPOINT/api/firmware/$KEY" -o "$DL"
          DL_CRC=$(python3 -c "import sys,zlib;print(format(zlib.crc32(open(sys.argv[1],'rb').read()) & 0xffffffff, '08x'))" "$DL")
          if [ "$DL_CRC" != "$LOCAL_CRC" ]; then
            echo "::error::round-trip CRC $DL_CRC != local $LOCAL_CRC"
            exit 1
          fi
          echo "::notice::round-trip OK ($DL_CRC, $(stat -c%s "$DL") bytes)"

      # meshfiles is the download surface behind the firmware buttons on the
      # product pages. The object names carry no version: uploading replaces the
      # previous file in place, so the buttons never break, never go stale and
      # never need editing again. Replacing beats delete-then-upload, which would
      # leave the download dead for as long as the upload takes.
      #
      # Runs last on purpose. The catalog is uploaded and verified by this point,
      # so a failure here cannot cost a release — and the catalog is what keeps
      # every published build, so nothing is lost by meshfiles holding only the
      # latest.
      - name: Publish downloads to meshfiles
        if: steps.dedup.outputs.skip != 'true'
        env:
          # R2's S3 API rather than wrangler: a bucket-scoped R2 token is issued
          # for S3 and is refused by the account-level REST path wrangler calls,
          # which returns a bare 403 "Authentication error".
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          # Recent aws-cli versions add integrity headers by default that R2 has
          # historically rejected; only send them when the API asks for them.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          PIO_ENV: ${{ matrix.pio_env }}
          BIN: ${{ steps.artifacts.outputs.bin }}
          UF2: ${{ steps.artifacts.outputs.uf2 }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::warning::R2 credentials not set — skipping meshfiles publish"
            exit 0
          fi
          if [ -z "$UF2" ]; then
            echo "::error::no .uf2 built for $PIO_ENV — the USB flashing download cannot be updated"
            echo "::error::the catalog upload above already succeeded; only this download is stale"
            exit 1
          fi
          put() {
            aws s3 cp "$1" "s3://meshfiles/$2" \
              --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/octet-stream --only-show-errors
            echo "::notice::meshfiles <- $2 ($(stat -c%s "$1") bytes)"
          }
          put "$BIN" "firmware-$PIO_ENV.bin"
          put "$UF2" "firmware-$PIO_ENV.uf2"

      # Replacing the object in R2 does not reach Cloudflare's edge cache: after
      # the 2026-10-14 publish, three of the four downloads still served the
      # build from five days before (cf-cache-status HIT). Purge the two URLs
      # this job just replaced, then fetch them back through the cache, the way
      # a visitor would, and compare them with what was uploaded.
      - name: Purge meshfiles downloads from the Cloudflare cache
        if: steps.dedup.outputs.skip != 'true'
        env:
          # API token with only Zone > Cache Purge > Purge, on cvaldess.com.
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          MESHFILES_URL: https://meshfiles.cvaldess.com
          PIO_ENV: ${{ matrix.pio_env }}
          BIN: ${{ steps.artifacts.outputs.bin }}
          UF2: ${{ steps.artifacts.outputs.uf2 }}
        run: |
          if [ -z "$CF_PURGE_TOKEN" ] || [ -z "$ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_PURGE_TOKEN or CLOUDFLARE_ZONE_ID not set — the meshfiles downloads may serve the previous build until the edge cache expires"
            exit 0
          fi
          URL_BIN="$MESHFILES_URL/firmware-$PIO_ENV.bin"
          URL_UF2="$MESHFILES_URL/firmware-$PIO_ENV.uf2"
          RESP=$(mktemp)
          HTTP=$(curl -sS -o "$RESP" -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -cn --arg a "$URL_BIN" --arg b "$URL_UF2" '{files: [$a, $b]}')")
          if [ "$HTTP" -ne 200 ] || [ "$(jq -r '.success' < "$RESP" 2>/dev/null)" != "true" ]; then
            echo "::error::cache purge failed, HTTP $HTTP: $(jq -c '.errors' < "$RESP" 2>/dev/null || cat "$RESP")"
            echo "::error::the catalog and meshfiles uploads above succeeded; only the cached downloads may be stale"
            exit 1
          fi
          echo "::notice::purged $URL_BIN and $URL_UF2"
          # A purge takes a few seconds to reach every edge, so retry before
          # calling a download stale.
          check() {
            local url=$1 want got=""
            want=$(sha256sum < "$2" | cut -d' ' -f1)
            for _ in 1 2 3 4 5 6; do
              got=$(curl -fsS "$url" | sha256sum | cut -d' ' -f1)
              if [ "$got" = "$want" ]; then
                echo "::notice::$url serves the uploaded file ($want)"
                return 0
              fi
              sleep 5
            done
            echo "::error::$url serves $got, not the uploaded $want"
            return 1
          }
          rc=0
          check "$URL_BIN" "$BIN" || rc=1
          check "$URL_UF2" "$UF2" || rc=1
          exit $rc
